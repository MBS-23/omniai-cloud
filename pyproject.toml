# Vercel builds Python projects with uv, which reads [project] from this file
# and ignores requirements.txt when pyproject.toml exists. So the dependencies
# listed here are exactly what the deployed function gets: the lite profile
# only, with no PyTorch and no model weights.
#
# For local use with every model on this machine, install
# requirements/offline.txt instead; that stack is far too large for a
# serverless function and must never be listed here.

[project]
name = "omniai-cloud"
version = "2.0.0"
description = "Unified multi-modal AI with automatic model selection and explainability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.2",
    "python-dotenv==1.2.1",
    "requests==2.32.3",
    "Pillow==11.3.0",
    "pypdf==6.1.1",
    "pdf2image==1.17.0",
    "python-docx==1.2.0",
    "langdetect==1.0.9",
]

[tool.vercel]
entrypoint = "backend.main:app"
