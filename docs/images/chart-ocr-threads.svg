<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="t d">
<title id="t">PaddleOCR seconds per image on 2 CPU cores</title>
<desc id="d">Thread count matched to the container&#x27;s CPU quota, against PaddleOCR&#x27;s default of 8. Printed notice: Threads = CPU quota (as shipped) 4.3 s, Default threads 8.2 s; Scanned page: Threads = CPU quota (as shipped) 5.7 s, Default threads 12.1 s; Street photo: Threads = CPU quota (as shipped) 2.0 s, Default threads 4.1 s</desc>
<style>
.title{font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1f2328}
.sub{font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#59636e}
.label{font:400 13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1f2328}
.value{font:500 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#59636e;font-variant-numeric:tabular-nums}
.tick{font:400 11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#818b98;font-variant-numeric:tabular-nums}
.grid{stroke:#d1d9e0;stroke-width:1}
.base{stroke:#9198a1;stroke-width:1}
.accent{fill:#d9541e}
.context{fill:#8b8a84}
@media (prefers-color-scheme: dark){
.title,.label{fill:#e6edf3}
.sub,.value{fill:#9198a1}
.tick{fill:#768390}
.grid{stroke:#30363d}
.base{stroke:#656c76}
.accent{fill:#e0602a}
.context{fill:#7d7c76}
}
</style>
