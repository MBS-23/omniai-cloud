<svg xmlns="http://www.w3.org/2000/svg" width="720" height="218" viewBox="0 0 720 218" role="img" aria-labelledby="t d">
<title id="t">Seconds per call on 2 CPU cores</title>
<desc id="d">Same input and settings. T5&#x27;s summary was identical; BLIP&#x27;s caption was worded differently. BLIP-large caption: int8 (as shipped) 7.3 s, fp32 48.2 s; T5-base summary: int8 (as shipped) 4.1 s, fp32 9.8 s</desc>
<style>
.title{font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1f2328}
.sub{font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#59636e}
.label{font:400 13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1f2328}
.value{font:500 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#59636e;font-variant-numeric:tabular-nums}
.tick{font:400 11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#818b98;font-variant-numeric:tabular-nums}
.grid{stroke:#d1d9e0;stroke-width:1}
.base{stroke:#9198a1;stroke-width:1}
.accent{fill:#d9541e}
.context{fill:#8b8a84}
@media (prefers-color-scheme: dark){
.title,.label{fill:#e6edf3}
.sub,.value{fill:#9198a1}
.tick{fill:#768390}
.grid{stroke:#30363d}
.base{stroke:#656c76}
.accent{fill:#e0602a}
.context{fill:#7d7c76}
}
</style>
<text class="title" x="0" y="20">Seconds per call on 2 CPU cores</text>
<text class="sub" x="0" y="40">Same input and settings. T5&#x27;s summary was identical; BLIP&#x27;s caption was worded differently.</text>
